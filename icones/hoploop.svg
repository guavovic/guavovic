<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- App-icon form of the mark: white headphone band on the brand blue.
       Reversed out like this because at favicon size a filled tile reads
       far better than a thin blue arc on transparent. -->
  <rect width="100" height="100" rx="26" fill="#2979FF"/>
  <g transform="translate(50 51) scale(0.74) translate(-50 -55.5)">
    <path d="M20,68 Q50,18 80,68" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="20" cy="68" r="11" fill="#ffffff"/>
    <circle cx="80" cy="68" r="11" fill="#ffffff"/>
  </g>
</svg>
